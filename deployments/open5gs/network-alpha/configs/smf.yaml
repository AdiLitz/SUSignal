logger:
  level: info

smf:
  sbi:
    server:
      - address: smf
        port: 7777
    client:
      nrf:
        - uri: https://nrf:7777
  pfcp:
    server:
      - address: smf
    client:
      upf:
        - address: upf
  gtpc:
    server:
      - address: smf
  gtpu:
    server:
      - address: smf
  session:
    - subnet: 10.45.0.0/16
      gateway: 10.45.0.1
  dns:
    - 8.8.8.8
  mtu: 1400

  default:
    tls:
      server:
        scheme: https
        private_key: /etc/open5gs/tls/server.key
        cert: /etc/open5gs/tls/server.crt
        verify_client: true
        verify_client_cacert: /etc/open5gs/tls/ca.crt
      client:
        scheme: https
        cacert: /etc/open5gs/tls/ca.crt
        client_private_key: /etc/open5gs/tls/server.key
        client_cert: /etc/open5gs/tls/server.crt
